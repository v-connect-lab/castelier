<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noai, noimageai">
  <title>Castelier (キャストリエ)</title>
  <!-- YAMLパーサー -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --creator-color: #ec4899;
      --streamer-color: #3b82f6;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* ヘッダー */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }
    .header-links a, .header-links button {
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-left: 8px;
      cursor: pointer;
    }
    .btn-manage {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-logout {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }
    .btn-login {
      background: var(--primary);
      color: #fff;
      border: none;
    }

    /* メインコンテナ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    /* 検索パネル */
    .filter-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .role-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .role-btn {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-sub);
      transition: all 0.2s;
    }
    .role-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .role-btn[data-role="creator"].active {
      background: var(--creator-color);
      border-color: var(--creator-color);
    }
    .role-btn[data-role="streamer"].active {
      background: var(--streamer-color);
      border-color: var(--streamer-color);
    }

    .search-inputs {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    @media (max-width: 640px) {
      .search-inputs { grid-template-columns: 1fr; }
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* 件数 */
    .results-count {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* グリッドレイアウト */
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* カード */
    .user-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .user-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .card-thumb {
      width: 100%;
      height: 160px;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }
    .card-thumb-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .role-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 12px;
      color: #fff;
      z-index: 2;
    }
    .role-badge.creator { background: var(--creator-color); }
    .role-badge.streamer { background: var(--streamer-color); }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #cbd5e1;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .card-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-category {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
      min-height: 2.6em;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
    }
    .tag-badge {
      font-size: 0.7rem;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      border-radius: var(--radius);
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      position: relative;
      padding: 24px;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* メディア埋め込みスタイル */
    .modal-works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .media-box {
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .media-box img.modal-work-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      display: block;
    }
    .media-audio-box {
      padding: 16px;
    }
    .media-link-box {
      padding: 16px;
    }
    .external-work-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: background 0.15s;
    }
    .external-work-link:hover {
      background: #e0e7ff;
    }

    .modal-links a {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 8px;
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }
    .modal-links a:hover {
      background: var(--primary);
      color: #fff;
    }

    .loading-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* Googleドライブ埋め込み枠のズレ・余白補正 */
    .drive-embed-container {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden; /* はみ出た上部ヘッダーやスクロールバーを完全にカット */
      border-radius: 6px;
      background: #1e293b;
    }

    .drive-embed-iframe {
      position: absolute;
      top: -52px; /* ★上部の黒いヘッダーバー（ファイル名・外部リンクボタン）を枠外に隠す */
      left: 0;
      width: 100%;
      height: calc(100% + 56px); /* 削った分だけ高さを足してコントローラーを収める */
      border: 0;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <a href="./top.html" class="header-logo">Castelier</a>
    <div class="header-links" id="headerAuthNav"></div>
  </header>

  <div class="container">
    <div class="filter-panel">
      <div class="role-tabs">
        <button class="role-btn active" data-role="all" onclick="setRoleFilter('all')">すべて</button>
        <button class="role-btn" data-role="creator" onclick="setRoleFilter('creator')">クリエイター</button>
        <button class="role-btn" data-role="streamer" onclick="setRoleFilter('streamer')">配信者</button>
      </div>
      <div class="search-inputs">
        <input type="text" id="keywordSearch" class="search-input" placeholder="名前・自己紹介・タグ・カテゴリで検索..." oninput="renderFilteredUsers()">
        <input type="text" id="categorySearch" class="search-input" placeholder="カテゴリ絞り込み..." oninput="renderFilteredUsers()">
      </div>
    </div>

    <div class="results-count" id="resultsCount">読み込み中...</div>

    <div class="user-grid" id="userGrid">
      <div class="loading-state">ユーザー一覧を読み込んでいます...</div>
    </div>
  </div>

  <div class="modal-overlay" id="userModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyKigWvQ5JmKO275b0ZGb_koWmpwgS4bdSh0057Wyewnm-iWArzM0okdOC4anR4O9U_cg/exec';

    let allUsers = [];
    let currentRole = 'all';
    let schemaData = null;
    let labelMaps = {
      role: { creator: 'クリエイター', streamer: '配信者' },
      category: {},
      tags: {},
      priceGuide: {}
    };

    // GoogleドライブURLの変換
    function normalizeDriveUrl(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
      }
      return url;
    }

    // accounts.yaml からオプションとラベルの対応辞書を生成
    function buildLabelMaps(cols) {
      if (cols.tags && cols.tags.options && cols.tags.optionLabels) {
        cols.tags.options.forEach((val, i) => {
          labelMaps.tags[val] = cols.tags.optionLabels[i] || val;
        });
      }
      if (cols.priceGuide && cols.priceGuide.options && cols.priceGuide.optionLabels) {
        cols.priceGuide.options.forEach((val, i) => {
          labelMaps.priceGuide[val] = cols.priceGuide.optionLabels[i] || val;
        });
      }
      if (cols.category && cols.category.options && cols.category.optionLabels) {
        ['creator', 'streamer'].forEach(r => {
          const opts = cols.category.options[r] || [];
          const lbls = cols.category.optionLabels[r] || [];
          opts.forEach((val, i) => {
            labelMaps.category[val] = lbls[i] || val;
          });
        });
      }
    }

    function getLabel(group, val) {
      if (!val) return '';
      const trimmed = String(val).trim();
      return (labelMaps[group] && labelMaps[group][trimmed]) ? labelMaps[group][trimmed] : trimmed;
    }

    function parseCommaLabels(group, commaStr) {
      if (!commaStr) return [];
      return String(commaStr)
        .split(',')
        .map(v => v.trim())
        .filter(Boolean)
        .map(v => getLabel(group, v));
    }

    // メディアURLの種別判別
    function analyzeMediaUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return null;
      const url = rawUrl.trim();

      // 1. YouTube
      const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch && ytMatch[1]) {
        const videoId = ytMatch[1];
        return {
          type: 'youtube',
          url: url,
          embedUrl: `https://www.youtube.com/embed/${videoId}`,
          thumbUrl: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
        };
      }

      // 2. Googleドライブのリンク（動画・音楽・画像をすべてGoogle公式プレイヤー/ビューアで再生・表示）
      const driveMatch = url.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]{25,})/);
      if (driveMatch && driveMatch[1]) {
        const fileId = driveMatch[1];
        return {
          type: 'drive_embed',
          fileId: fileId,
          embedUrl: `https://drive.google.com/file/d/${fileId}/preview`,
          thumbUrl: `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`,
          url: url
        };
      }

      // 3. 音声ファイル直リンク (.mp3, .wav等)
      if (/\.(mp3|wav|ogg|m4a)(\?.*)?$/i.test(url)) {
        return { type: 'audio', url: url };
      }

      // 4. 動画ファイル直リンク (.mp4, .webm等)
      if (/\.(mp4|webm)(\?.*)?$/i.test(url)) {
        return { type: 'video', url: url };
      }

      // 5. 画像直リンク (.jpg, .png等)
      if (/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i.test(url) || url.includes('googleusercontent.com')) {
        return { type: 'image', url: url, rawUrl: url };
      }

      // 6. 外部Webサイト
      return { type: 'link', url: url };
    }

    // モーダル用メディアコンポーネント生成
    function renderMediaComponent(item) {
      if (!item) return '';

      switch (item.type) {
        // Googleドライブ（動画・音声・プレビューを自動対応）
        case 'drive_embed':
          return `
            <div class="media-box">
              <div class="drive-embed-container">
                <iframe src="${item.embedUrl}" 
                        class="drive-embed-iframe"
                        allow="autoplay"></iframe>
              </div>
            </div>
          `;

        case 'image':
          return `
            <div class="media-box">
              <img src="${item.url}" class="modal-work-img" alt="作品画像">
            </div>
          `;

        case 'youtube':
          return `
            <div class="media-box" style="position:relative; padding-top:56.25%;">
              <iframe src="${item.embedUrl}" 
                      style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      allowfullscreen></iframe>
            </div>
          `;

        case 'audio':
          return `
            <div class="media-box media-audio-box">
              <div style="font-size:0.8rem; font-weight:bold; margin-bottom:8px; color:var(--primary);">🎵 音声・楽曲サンプル</div>
              <audio controls src="${item.url}" style="width:100%; height:40px;"></audio>
            </div>
          `;

        case 'video':
          return `
            <div class="media-box">
              <video controls src="${item.url}" style="width:100%; max-height:220px; background:#000; display:block;"></video>
            </div>
          `;

        case 'link':
        default:
          let domain = item.url;
          try { domain = new URL(item.url).hostname; } catch(e){}
          return `
            <div class="media-box media-link-box">
              <div style="font-size:0.75rem; color:#64748b;">🔗 制作実績・サイトリンク</div>
              <a href="${item.url}" target="_blank" rel="noopener" class="external-work-link">
                <span>${escapeHtml(domain)} で開く</span>
                <span>↗</span>
              </a>
            </div>
          `;
      }
    }

    // ヘッダーナビの切り替え
    function renderHeaderNav() {
      const nav = document.getElementById('headerAuthNav');
      const session = sessionStorage.getItem('castelier_session');

      if (session) {
        nav.innerHTML = `
          <a href="./admin.html" class="btn-manage">管理画面</a>
          <button onclick="handleLogout()" class="btn-logout">ログアウト</button>
        `;
      } else {
        nav.innerHTML = `
          <a href="./index.html" class="btn-login">ログイン / 登録</a>
        `;
      }
    }

    function handleLogout() {
      if (confirm('ログアウトしますか？')) {
        sessionStorage.removeItem('castelier_session');
        localStorage.removeItem('castelier_registered_at');
        alert('ログアウトしました。');
        window.location.href = './index.html';
      }
    }

    // 初期化とデータ読み込み
    window.addEventListener('DOMContentLoaded', async () => {
      renderHeaderNav();

      const registeredAt = localStorage.getItem('castelier_registered_at');
      const now = Date.now();
      const FIFTEEN_MINUTES = 15 * 60 * 1000;
      const isRecentlyRegistered = registeredAt && (now - parseInt(registeredAt, 10) < FIFTEEN_MINUTES);

      try {
        const fetchSchema = fetch('./schema/accounts.yaml').then(r => r.text());
        const fetchUserData = (async () => {
          if (isRecentlyRegistered) {
            console.log('登録直後のため、最新データをGASから取得します。');
            const res = await fetch(`${GAS_API_URL}?action=getPublicUsers`);
            return await res.json();
          } else {
            const res = await fetch(`./data/users.json?t=${now}`);
            if (!res.ok) throw new Error('users.json fetch error');
            const json = await res.json();
            return { success: true, users: json };
          }
        })();

        const [schemaYaml, userResult] = await Promise.all([fetchSchema, fetchUserData]);

        const loadedYaml = jsyaml.load(schemaYaml);
        schemaData = loadedYaml.accounts.columns;
        buildLabelMaps(schemaData);

        if (userResult.success) {
          allUsers = userResult.users || [];
          renderFilteredUsers();
        } else {
          throw new Error(userResult.message || 'データ取得失敗');
        }

      } catch (err) {
        console.warn('初期読み込みフォールバック:', err);
        try {
          const fbRes = await fetch(`${GAS_API_URL}?action=getPublicUsers`);
          const fbData = await fbRes.json();
          allUsers = fbData.users || [];
          renderFilteredUsers();
        } catch (fbErr) {
          document.getElementById('userGrid').innerHTML = '<div class="loading-state">ユーザー一覧の取得に失敗しました。</div>';
        }
      }
    });

    function setRoleFilter(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });
      renderFilteredUsers();
    }

    function renderFilteredUsers() {
      const keyword = document.getElementById('keywordSearch').value.toLowerCase().trim();
      const catSearch = document.getElementById('categorySearch').value.toLowerCase().trim();

      const filtered = allUsers.filter(u => {
        if (currentRole !== 'all' && u.role !== currentRole) return false;

        const catLabels = parseCommaLabels('category', u.category).join(' ').toLowerCase();
        if (catSearch && !catLabels.includes(catSearch) && !(u.category || '').toLowerCase().includes(catSearch)) {
          return false;
        }

        if (keyword) {
          const tagLabels = parseCommaLabels('tags', u.tags).join(' ');
          const matchTarget = [
            u.displayName || '',
            u.description || '',
            catLabels,
            tagLabels,
            u.freeTags || ''
          ].join(' ').toLowerCase();

          if (!matchTarget.includes(keyword)) return false;
        }

        return true;
      });

      document.getElementById('resultsCount').textContent = `該当ユーザー: ${filtered.length} 件`;

      const grid = document.getElementById('userGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading-state">条件に一致するユーザーは見つかりませんでした。</div>';
        return;
      }

      grid.innerHTML = filtered.map((u, idx) => {
        const avatarUrl = normalizeDriveUrl(u.avatarUrl);
        const roleLabel = getLabel('role', u.role);

        // 代表作1からサムネイル生成
        const media1 = analyzeMediaUrl(u['workUrls-1']);
        let thumbHtml = '<div class="card-thumb-empty">No Preview</div>';

        if (media1) {
          if (media1.type === 'image' || media1.type === 'drive_embed') {
            thumbHtml = `<img src="${media1.thumbUrl || media1.url}" alt="作品" onerror="this.parentElement.innerHTML='<div class=\\'card-thumb-empty\\'>Media File</div>'">`;
          } else if (media1.type === 'youtube') {
            thumbHtml = `
              <img src="${media1.thumbUrl}" alt="動画サムネイル">
              <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.35); font-size:2rem; color:#fff;">▶</span>
            `;
          } else if (media1.type === 'audio') {
            thumbHtml = `<div class="card-thumb-empty" style="background:#e0e7ff; color:var(--primary); font-weight:bold; font-size:1.1rem;">🎵 音声作品</div>`;
          } else if (media1.type === 'video') {
            thumbHtml = `<div class="card-thumb-empty" style="background:#f1f5f9; color:var(--text-main); font-weight:bold; font-size:1.1rem;">🎬 動画作品</div>`;
          } else if (media1.type === 'link') {
            thumbHtml = `<div class="card-thumb-empty" style="background:#f1f5f9; color:#64748b; font-weight:bold; font-size:1.1rem;">🔗 Webサイト</div>`;
          }
        }

        // カテゴリ（日本語変換）
        const catLabels = parseCommaLabels('category', u.category);
        const categoryDisplay = catLabels.join(' / ') || '未設定';

        // 属性タグ（日本語変換） + フリータグ（そのまま）
        const standardTags = parseCommaLabels('tags', u.tags);
        const freeTags = (u.freeTags ? String(u.freeTags).split(',') : []).map(t => t.trim()).filter(Boolean);
        const allCardTags = standardTags.concat(freeTags);

        return `
          <div class="user-card" onclick="openModal(${idx})">
            <div class="card-thumb">
              ${thumbHtml}
              <span class="role-badge ${u.role}">${roleLabel}</span>
            </div>
            <div class="card-body">
              <div class="card-header">
                ${avatarUrl ? `<img src="${avatarUrl}" class="card-avatar" alt="">` : '<div class="card-avatar"></div>'}
                <div style="overflow: hidden;">
                  <div class="card-name">${escapeHtml(u.displayName || '名無し')}</div>
                  <div class="card-category">${escapeHtml(categoryDisplay)}</div>
                </div>
              </div>
              <div class="card-desc">${escapeHtml(u.description || '自己紹介文はありません。')}</div>
              <div class="card-tags">
                ${allCardTags.slice(0, 4).map(t => `<span class="tag-badge">#${escapeHtml(t)}</span>`).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const u = allUsers[index];
      if (!u) return;

      const avatarUrl = normalizeDriveUrl(u.avatarUrl);
      const roleLabel = getLabel('role', u.role);
      const categoryDisplay = parseCommaLabels('category', u.category).join(' / ') || '未設定';
      const priceLabel = getLabel('priceGuide', u.priceGuide);
      
      // 登録されている作品URL（1〜4）をメディア解析
      const works = [1, 2, 3, 4]
        .map(i => analyzeMediaUrl(u[`workUrls-${i}`]))
        .filter(Boolean);

      const links = [];
      if (u.xUrl) links.push(`<a href="${u.xUrl}" target="_blank" rel="noopener">X (Twitter)</a>`);
      if (u.portfolioUrl) links.push(`<a href="${u.portfolioUrl}" target="_blank" rel="noopener">ポートフォリオHP</a>`);
      if (u['platformUrls-1']) links.push(`<a href="${u['platformUrls-1']}" target="_blank" rel="noopener">活動リンク 1</a>`);
      if (u['platformUrls-2']) links.push(`<a href="${u['platformUrls-2']}" target="_blank" rel="noopener">活動リンク 2</a>`);
      if (u['platformUrls-3']) links.push(`<a href="${u['platformUrls-3']}" target="_blank" rel="noopener">活動リンク 3</a>`);

      document.getElementById('modalBody').innerHTML = `
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
          ${avatarUrl ? `<img src="${avatarUrl}" style="width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid #e2e8f0;" alt="">` : ''}
          <div>
            <span class="role-badge ${u.role}" style="position:static; margin-bottom:4px; display:inline-block;">${roleLabel}</span>
            <h2 style="margin:4px 0 0 0; font-size:1.3rem;">${escapeHtml(u.displayName || '')}</h2>
            <div style="font-size:0.85rem; color:#64748b;">${escapeHtml(categoryDisplay)}</div>
          </div>
        </div>

        <div style="margin-bottom:16px; white-space:pre-wrap; font-size:0.9rem; line-height:1.6; color:#334155;">${escapeHtml(u.description || '自己紹介文はありません。')}</div>

        ${works.length > 0 ? `
          <div style="font-weight:bold; font-size:0.85rem; margin-bottom:8px;">代表作品・メディア</div>
          <div class="modal-works-grid">
            ${works.map(w => renderMediaComponent(w)).join('')}
          </div>
        ` : ''}

        ${priceLabel ? `
          <div style="margin:12px 0; font-size:0.85rem;">
            <strong>料金・予算目安:</strong> ${escapeHtml(priceLabel)}
          </div>
        ` : ''}

        ${links.length > 0 ? `
          <div style="font-weight:bold; font-size:0.85rem; margin-top:16px; margin-bottom:8px;">リンク・活動先</div>
          <div class="modal-links">${links.join('')}</div>
        ` : ''}

        ${u.contactInfo ? `
          <div style="margin-top:16px; padding:12px; background:#f8fafc; border-radius:6px; font-size:0.85rem;">
            <strong>連絡先窓口:</strong> ${escapeHtml(u.contactInfo)}
          </div>
        ` : ''}
      `;

      document.getElementById('userModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('userModal').classList.remove('open');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
