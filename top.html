<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noai, noimageai">
  <title>Castelier (キャストリエ)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --creator-color: #ec4899;
      --streamer-color: #3b82f6;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* ヘッダー */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }
    .header-links a {
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-left: 8px;
    }
    .btn-manage {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-login {
      background: var(--primary);
      color: #fff;
    }

    /* メインコンテナ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    /* 検索・絞り込みエリア */
    .filter-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    /* ロール切り替えタブ */
    .role-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .role-btn {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-sub);
      transition: all 0.2s;
    }
    .role-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .role-btn[data-role="creator"].active {
      background: var(--creator-color);
      border-color: var(--creator-color);
    }
    .role-btn[data-role="streamer"].active {
      background: var(--streamer-color);
      border-color: var(--streamer-color);
    }

    .search-inputs {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    @media (max-width: 640px) {
      .search-inputs { grid-template-columns: 1fr; }
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* 件数表示 */
    .results-count {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* 一覧グリッド */
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* カード */
    .user-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .user-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    /* サムネイル（作品1） */
    .card-thumb {
      width: 100%;
      height: 160px;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* ドラッグ・保存抑止 */
      user-select: none;
    }
    .card-thumb-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* ロールバッジ */
    .role-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 12px;
      color: #fff;
    }
    .role-badge.creator { background: var(--creator-color); }
    .role-badge.streamer { background: var(--streamer-color); }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #cbd5e1;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .card-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-category {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
      min-height: 2.6em;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
    }
    .tag-badge {
      font-size: 0.7rem;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      border-radius: var(--radius);
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      position: relative;
      padding: 24px;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-works-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .modal-work-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      pointer-events: none;
      user-select: none;
    }

    .modal-links a {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 8px;
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }
    .modal-links a:hover {
      background: var(--primary);
      color: #fff;
    }

    /* ローディング表示 */
    .loading-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-sub);
      font-size: 0.95rem;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <a href="./top.html" class="header-logo">Castelier</a>
    <div class="header-links">
      <a href="./admin.html" class="btn-manage">管理画面</a>
      <a href="./index.html" class="btn-login">ログイン / 登録</a>
    </div>
  </header>

  <div class="container">
    <!-- 絞り込みパネル -->
    <div class="filter-panel">
      <div class="role-tabs">
        <button class="role-btn active" data-role="all" onclick="setRoleFilter('all')">すべて</button>
        <button class="role-btn" data-role="creator" onclick="setRoleFilter('creator')">クリエイター</button>
        <button class="role-btn" data-role="streamer" onclick="setRoleFilter('streamer')">配信者</button>
      </div>
      <div class="search-inputs">
        <input type="text" id="keywordSearch" class="search-input" placeholder="名前・自己紹介・タグで検索..." oninput="renderFilteredUsers()">
        <input type="text" id="categorySearch" class="search-input" placeholder="カテゴリ絞り込み..." oninput="renderFilteredUsers()">
      </div>
    </div>

    <!-- 件数 -->
    <div class="results-count" id="resultsCount">読み込み中...</div>

    <!-- ユーザーカード一覧 -->
    <div class="user-grid" id="userGrid">
      <div class="loading-state">ユーザー一覧を読み込んでいます...</div>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="userModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ※お使いのGAS Web App URLに書き換えてください
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyk1gWVq5JmKoz73D6zGB_k0WmpWgs4BGsH00J7WyewnW-iWAFzM6ORGOC4aR_ePRry4Q/exec';

    let allUsers = [];
    let currentRole = 'all';

    // GoogleドライブURLの変換
    function normalizeDriveUrl(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
      }
      return url;
    }

    // 初期データ読み込み（登録後15分以内はGAS直読、それ以降はusers.json）
    window.addEventListener('DOMContentLoaded', async () => {
      const registeredAt = localStorage.getItem('castelier_registered_at');
      const now = Date.now();
      const FIFTEEN_MINUTES = 15 * 60 * 1000;

      // 登録から15分以内かどうかの判定
      const isRecentlyRegistered = registeredAt && (now - parseInt(registeredAt, 10) < FIFTEEN_MINUTES);

      try {
        if (isRecentlyRegistered) {
          console.log('登録直後のため、最新データをGASから直接取得します。');
          const res = await fetch(`${GAS_API_URL}?action=getPublicUsers`);
          const data = await res.json();
          allUsers = data.users || [];
        } else {
          // 15分経過している、または一般訪問者はGitHubの静的JSONを参照
          const res = await fetch(`./data/users.json?t=${now}`);
          if (!res.ok) throw new Error('users.json fetch error');
          const data = await res.json();
          allUsers = Array.isArray(data) ? data : [];
        }

        renderFilteredUsers();
      } catch (err) {
        // 万が一 users.json が失敗した場合はフォールバックとしてGASを叩く
        try {
          const fallbackRes = await fetch(`${GAS_API_URL}?action=getPublicUsers`);
          const fallbackData = await fallbackRes.json();
          allUsers = fallbackData.users || [];
          renderFilteredUsers();
        } catch (fallbackErr) {
          document.getElementById('userGrid').innerHTML = '<div class="loading-state">ユーザー一覧の取得に失敗しました。</div>';
        }
      }
    });

    // ロールフィルター切り替え
    function setRoleFilter(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });
      renderFilteredUsers();
    }

    // 一覧レンダリング
    function renderFilteredUsers() {
      const keyword = document.getElementById('keywordSearch').value.toLowerCase().trim();
      const catSearch = document.getElementById('categorySearch').value.toLowerCase().trim();

      const filtered = allUsers.filter(u => {
        // ロール判定
        if (currentRole !== 'all' && u.role !== currentRole) return false;

        // カテゴリ判定
        if (catSearch && (!u.category || !u.category.toLowerCase().includes(catSearch))) return false;

        // キーワード判定 (活動名・自己紹介・タグ・フリータグ)
        if (keyword) {
          const matchTarget = [
            u.displayName || '',
            u.description || '',
            u.tags || '',
            u.freeTags || ''
          ].join(' ').toLowerCase();

          if (!matchTarget.includes(keyword)) return false;
        }

        return true;
      });

      document.getElementById('resultsCount').textContent = `該当ユーザー: ${filtered.length} 件`;

      const grid = document.getElementById('userGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading-state">条件に一致するユーザーは見つかりませんでした。</div>';
        return;
      }

      grid.innerHTML = filtered.map((u, idx) => {
        const thumbUrl = normalizeDriveUrl(u['workUrls-1']);
        const avatarUrl = normalizeDriveUrl(u.avatarUrl);
        const roleName = u.role === 'creator' ? 'クリエイター' : '配信者';

        // タグ整形
        const tags = (u.tags ? u.tags.split(',') : []).concat(u.freeTags ? u.freeTags.split(',') : []);

        return `
          <div class="user-card" onclick="openModal(${idx})">
            <div class="card-thumb">
              ${thumbUrl ? `<img src="${thumbUrl}" alt="作品">` : '<div class="card-thumb-empty">No Work Image</div>'}
              <span class="role-badge ${u.role}">${roleName}</span>
            </div>
            <div class="card-body">
              <div class="card-header">
                ${avatarUrl ? `<img src="${avatarUrl}" class="card-avatar" alt="">` : '<div class="card-avatar"></div>'}
                <div style="overflow: hidden;">
                  <div class="card-name">${escapeHtml(u.displayName || '名無し')}</div>
                  <div class="card-category">${escapeHtml(u.category || '')}</div>
                </div>
              </div>
              <div class="card-desc">${escapeHtml(u.description || '自己紹介文はありません。')}</div>
              <div class="card-tags">
                ${tags.slice(0, 4).map(t => `<span class="tag-badge">#${escapeHtml(t.trim())}</span>`).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // モーダル表示
    function openModal(index) {
      const u = allUsers[index];
      if (!u) return;

      const avatarUrl = normalizeDriveUrl(u.avatarUrl);
      const roleName = u.role === 'creator' ? 'クリエイター' : '配信者';
      
      // 作品画像リスト
      const works = [1, 2, 3, 4]
        .map(i => normalizeDriveUrl(u[`workUrls-${i}`]))
        .filter(url => Boolean(url));

      // 外部リンク
      const links = [];
      if (u.xUrl) links.push(`<a href="${u.xUrl}" target="_blank" rel="noopener">X (Twitter)</a>`);
      if (u.portfolioUrl) links.push(`<a href="${u.portfolioUrl}" target="_blank" rel="noopener">ポートフォリオHP</a>`);
      if (u['platformUrls-1']) links.push(`<a href="${u['platformUrls-1']}" target="_blank" rel="noopener">活動リンク 1</a>`);
      if (u['platformUrls-2']) links.push(`<a href="${u['platformUrls-2']}" target="_blank" rel="noopener">活動リンク 2</a>`);
      if (u['platformUrls-3']) links.push(`<a href="${u['platformUrls-3']}" target="_blank" rel="noopener">活動リンク 3</a>`);

      document.getElementById('modalBody').innerHTML = `
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
          ${avatarUrl ? `<img src="${avatarUrl}" style="width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid #e2e8f0;" alt="">` : ''}
          <div>
            <span class="role-badge ${u.role}" style="position:static; margin-bottom:4px; display:inline-block;">${roleName}</span>
            <h2 style="margin:4px 0 0 0; font-size:1.3rem;">${escapeHtml(u.displayName || '')}</h2>
            <div style="font-size:0.85rem; color:#64748b;">${escapeHtml(u.category || '')}</div>
          </div>
        </div>

        <div style="margin-bottom:16px; white-space:pre-wrap; font-size:0.9rem; line-height:1.6; color:#334155;">${escapeHtml(u.description || '自己紹介文はありません。')}</div>

        ${works.length > 0 ? `
          <div style="font-weight:bold; font-size:0.85rem; margin-bottom:8px;">代表作品</div>
          <div class="modal-works-grid">
            ${works.map(w => `<img src="${w}" class="modal-work-img" alt="作品">`).join('')}
          </div>
        ` : ''}

        ${u.priceGuide ? `
          <div style="margin:12px 0; font-size:0.85rem;">
            <strong>料金・予算目安:</strong> ${escapeHtml(u.priceGuide)}
          </div>
        ` : ''}

        ${links.length > 0 ? `
          <div style="font-weight:bold; font-size:0.85rem; margin-top:16px; margin-bottom:8px;">リンク・活動先</div>
          <div class="modal-links">${links.join('')}</div>
        ` : ''}

        ${u.contactInfo ? `
          <div style="margin-top:16px; padding:12px; background:#f8fafc; border-radius:6px; font-size:0.85rem;">
            <strong>連絡先窓口:</strong> ${escapeHtml(u.contactInfo)}
          </div>
        ` : ''}
      `;

      document.getElementById('userModal').classList.add('open');
    }

    function closeModal(e) {
      document.getElementById('userModal').classList.remove('open');
    }

    // XSS対策用サニタイズ
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
