<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <title>Castelier | 運営用ダッシュボード</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-sub: #334155;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --border: #334155;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-badge {
      background: #4338ca;
      color: #c7d2fe;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-sub {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-sub:hover { background: #475569; }

    /* ログインカード */
    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; color: var(--text-sub); }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
    }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    /* ダッシュボードパネル */
    .dashboard-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
    .stat-value { font-size: 1.4rem; font-weight: 800; margin-top: 4px; }

    /* コントロールバー */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .search-wrap { flex-grow: 1; max-width: 340px; }
    .status-tabs { display: flex; gap: 6px; }
    .tab-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ユーザーテーブル */
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #0f172a;
      color: var(--text-sub);
      font-weight: 600;
      white-space: nowrap;
    }
    tr:hover { background: rgba(255, 255, 255, 0.02); }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
    }
    .badge-status.active { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .badge-status.banned { background: #7f1d1d; color: #fca5a5; border: 1px solid #b91c1c; }

    .badge-role {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-role.creator { background: #831843; color: #fbcfe8; }
    .badge-role.streamer { background: #1e3a8a; color: #bfdbfe; }

    .btn-ban {
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #b91c1c;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-ban:hover { background: #991b1b; }
    .btn-unban {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-unban:hover { background: #047857; }

    .hidden { display: none !important; }
    .loading-notice {
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <div class="header-title">
      <span>Castelier 運営ダッシュボード</span>
      <span class="header-badge">Superadmin</span>
    </div>
    <div class="header-actions">
      <a href="./top.html" class="btn-sub">TOP画面へ</a>
      <button class="btn-sub hidden" id="btnLogout" onclick="handleAdminLogout()">ログアウト</button>
    </div>
  </div>

  <!-- 1. 管理者ログイン画面 -->
  <div id="loginView" class="login-box">
    <h2 style="font-size: 1.1rem; margin-bottom: 16px; text-align: center;">管理者認証</h2>
    <div class="form-group">
      <label>管理者ユーザーID</label>
      <input type="text" id="adminUserId" placeholder="usr_...">
    </div>
    <div class="form-group">
      <label>パスコード</label>
      <input type="password" id="adminPassword" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btnLogin" onclick="handleAdminLogin()">ログイン</button>
    <div id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px; display: none;"></div>
  </div>

  <!-- 2. 管理メイン画面 -->
  <div id="dashboardView" class="hidden">
    <!-- 統計サマリー -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">総アカウント数</div>
        <div class="stat-value" id="statTotalUsers">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">正常アカウント (Active)</div>
        <div class="stat-value" style="color: var(--success);" id="statActiveUsers">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">凍結アカウント (Banned)</div>
        <div class="stat-value" style="color: var(--danger);" id="statBannedUsers">0</div>
      </div>
    </div>

    <div class="dashboard-panel">
      <!-- フィルタコントロール -->
      <div class="filter-bar">
        <div class="search-wrap">
          <input type="text" id="userSearchInput" placeholder="ID・表示名で絞り込み..." oninput="renderUsersTable()">
        </div>
        <div class="status-tabs">
          <button class="tab-btn active" data-filter="all" onclick="setStatusFilter('all')">すべて</button>
          <button class="tab-btn" data-filter="active" onclick="setStatusFilter('active')">通常</button>
          <button class="tab-btn" data-filter="banned" onclick="setStatusFilter('banned')">凍結のみ</button>
        </div>
        <button class="btn-sub" onclick="loadUsersList()" title="最新データを再取得">🔄 更新</button>
      </div>

      <!-- テーブル -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ユーザーID</th>
              <th>活動名</th>
              <th>区分</th>
              <th>公開設定</th>
              <th>状態</th>
              <th>登録日時</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="7" class="loading-notice">データを読み込んでいます...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyk1gWVq5JmKoz73D6zGB_k0WmpWgs4BGsH00J7WyewnW-iWAFzM6ORGOC4aR_ePRry4Q/exec';

  let currentAdminUser = null;
  let allAdminUsers = [];
  let currentStatusFilter = 'all';

  window.addEventListener('DOMContentLoaded', () => {
    // 既存セッションのチェック
    const sessionStr = sessionStorage.getItem('castelier_session');
    if (sessionStr) {
      try {
        const session = JSON.parse(sessionStr);
        document.getElementById('adminUserId').value = session.userId || '';
        document.getElementById('adminPassword').value = session.password || '';
        handleAdminLogin();
      } catch (e) {}
    }
  });

  async function handleAdminLogin() {
    const userId = document.getElementById('adminUserId').value.trim();
    const password = document.getElementById('adminPassword').value.trim();
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');

    if (!userId || !password) {
      errEl.textContent = 'ユーザーIDとパスコードを入力してください。';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '認証中...';
    errEl.style.display = 'none';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'superadminGetUsers',
          data: { adminUserId: userId, adminPassword: password }
        })
      });
      const data = await res.json();

      if (data.success) {
        currentAdminUser = { userId, password };
        allAdminUsers = data.users || [];

        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        document.getElementById('btnLogout').classList.remove('hidden');

        updateStats();
        renderUsersTable();
      } else {
        errEl.textContent = data.message || '管理者権限がありません。';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = '通信エラー: ' + err.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'ログイン';
    }
  }

  function handleAdminLogout() {
    currentAdminUser = null;
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('btnLogout').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('adminPassword').value = '';
  }

  async function loadUsersList() {
    if (!currentAdminUser) return;
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '<tr><td colspan="7" class="loading-notice">最新データを取得中...</td></tr>';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'superadminGetUsers',
          data: { adminUserId: currentAdminUser.userId, adminPassword: currentAdminUser.password }
        })
      });
      const data = await res.json();
      if (data.success) {
        allAdminUsers = data.users || [];
        updateStats();
        renderUsersTable();
      } else {
        alert(data.message || 'データ取得に失敗しました。');
      }
    } catch (e) {
      alert('通信エラーが発生しました。');
    }
  }

  function updateStats() {
    const total = allAdminUsers.length;
    const banned = allAdminUsers.filter(u => String(u.status).toLowerCase() === 'banned').length;
    const active = total - banned;

    document.getElementById('statTotalUsers').textContent = total;
    document.getElementById('statActiveUsers').textContent = active;
    document.getElementById('statBannedUsers').textContent = banned;
  }

  function setStatusFilter(status) {
    currentStatusFilter = status;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === status);
    });
    renderUsersTable();
  }

  function renderUsersTable() {
    const keyword = document.getElementById('userSearchInput').value.toLowerCase().trim();
    const tbody = document.getElementById('usersTableBody');

    const filtered = allAdminUsers.filter(u => {
      const status = String(u.status || 'active').toLowerCase();
      if (currentStatusFilter !== 'all' && status !== currentStatusFilter) return false;

      if (keyword) {
        const targetStr = `${u.userId || ''} ${u.displayName || ''}`.toLowerCase();
        if (!targetStr.includes(keyword)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="loading-notice">該当するユーザーはいません。</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(u => {
      const isBanned = String(u.status || 'active').toLowerCase() === 'banned';
      const isSelf = currentAdminUser && currentAdminUser.userId === u.userId;
      const roleLabel = u.role === 'streamer' ? '配信者' : 'クリエイター';
      const isPublic = (u.isPublic === true || String(u.isPublic).toLowerCase() === 'true');

      return `
        <tr>
          <td>
            <code>${escapeHtml(u.userId)}</code>
            ${u.administrator ? '<span style="color:#f59e0b; font-size:0.75rem; margin-left:4px;" title="管理者権限あり">★運営</span>' : ''}
          </td>
          <td><strong>${escapeHtml(u.displayName || '名無し')}</strong></td>
          <td><span class="badge-role ${u.role}">${roleLabel}</span></td>
          <td style="color:${isPublic ? '#6ee7b7' : '#94a3b8'}">${isPublic ? '公開' : '非公開'}</td>
          <td>
            <span class="badge-status ${isBanned ? 'banned' : 'active'}">
              ${isBanned ? '凍結 (BANNED)' : '正常 (Active)'}
            </span>
          </td>
          <td style="font-size:0.75rem; color:var(--text-sub); white-space:nowrap;">${escapeHtml(u.createdAt || '-')}</td>
          <td>
            ${isSelf ? `
              <span style="font-size:0.75rem; color:var(--text-sub);">操作不可(自分)</span>
            ` : isBanned ? `
              <button class="btn-unban" onclick="handleToggleBan('${escapeHtml(u.userId)}', 'active')">解除</button>
            ` : `
              <button class="btn-ban" onclick="handleToggleBan('${escapeHtml(u.userId)}', 'banned')">🚫 BAN</button>
            `}
          </td>
        </tr>
      `;
    }).join('');
  }

  async function handleToggleBan(targetUserId, nextStatus) {
    const actionName = nextStatus === 'banned' ? 'アカウントを凍結（BAN）' : '凍結を解除';
    if (!confirm(`ユーザー「${targetUserId}」の${actionName}しますか？`)) {
      return;
    }

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'superadminToggleBan',
          data: {
            adminUserId: currentAdminUser.userId,
            adminPassword: currentAdminUser.password,
            targetUserId: targetUserId,
            newStatus: nextStatus
          }
        })
      });
      const data = await res.json();

      if (data.success) {
        // ローカルデータを即時更新
        const target = allAdminUsers.find(u => u.userId === targetUserId);
        if (target) target.status = nextStatus;

        updateStats();
        renderUsersTable();
        alert(data.message);
      } else {
        alert(data.message || '操作に失敗しました。');
      }
    } catch (e) {
      alert('通信エラーが発生しました: ' + e.message);
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
