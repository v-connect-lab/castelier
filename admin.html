<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- AI学習抑止メタタグ -->
  <meta name="robots" content="noai, noimageai">
  
  <title>Castelier | プロフィール管理</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px 28px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-nav a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .header-nav a:hover { text-decoration: underline; }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.4rem; }
    .user-badge {
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .lead { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 24px; }
    
    .form-group { margin-bottom: 16px; }
    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    /* ツールチップ（インフォマーク） */
    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e2e8f0;
      color: var(--text-sub);
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer; /* スマホでも押しやすいよう pointer に変更 */
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* PCホバー時、またはスマホでタップされて .active がついた時に表示 */
    .info-icon:hover::after,
    .info-icon.active::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: normal;
      white-space: normal;
      width: 240px;
      z-index: 50;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      line-height: 1.4;
      pointer-events: none;
    }
    
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }
    input:disabled, select:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    textarea { resize: vertical; min-height: 80px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fafafa;
    }
    .checkbox-label {
      font-size: 0.8rem;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-bottom: 0;
    }

    button.btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background-color: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-logout {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-logout:hover { color: #dc2626; }

    .status-box {
      padding: 12px;
      margin-top: 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      display: none;
    }
    .status-box.success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-box.error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .loading-overlay {
      text-align: center;
      padding: 60px 0;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
    .section-divider { border: 0; border-top: 1px dashed var(--border); margin: 20px 0; }

    /* プレビュー表示用スタイル */
    .img-preview-box {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 12px;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .img-preview-box img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 1px solid var(--border);
    }
    .img-preview-box.square img {
      border-radius: 4px;
      width: 60px;
      height: 60px;
    }
    .img-preview-box span {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-nav">
    <a href="./top.html">← TOPページに戻る</a>
    <span style="font-size: 0.85rem; color: var(--text-sub);">アカウント管理</span>
  </div>

  <div id="loadingView" class="loading-overlay">
    アカウントデータを読み込み中...
  </div>

  <div id="mainFormView" class="hidden">
    <div class="title-row">
      <h1>プロフィール編集</h1>
      <span class="user-badge" id="displayUserId"></span>
    </div>
    <p class="lead">登録情報はスプレッドシートおよびプラットフォームに即時同期されます。</p>

    <form id="profileForm" onsubmit="handleUpdate(event)">
      <div class="grid-2">
        <div class="form-group">
          <label>ユーザー区分 <span class="info-icon" id="tip-prof-role">ℹ</span></label>
          <select id="profRole" disabled style="background:#f1f5f9; cursor:not-allowed;">
            <option value="creator">クリエイター</option>
            <option value="streamer">配信者</option>
          </select>
        </div>
        <div class="form-group">
          <label>活動名（表示名） * <span class="info-icon" id="tip-prof-displayName">ℹ</span></label>
          <input type="text" id="profDisplayName" required>
        </div>
      </div>

      <!-- 配信者のみ表示する設定 -->
      <div class="grid-2 hidden" id="profStreamerSettingsGroup">
        <div class="form-group">
          <label>公開設定 <span class="info-icon" id="tip-prof-isPublic">ℹ</span></label>
          <select id="profIsPublic" onchange="handlePublicChange('prof')">
            <option value="true">公開</option>
            <option value="false">非公開</option>
          </select>
        </div>
        <div class="form-group">
          <label id="lbl-profIsContactWelcome">お声がけ歓迎設定 <span class="info-icon" id="tip-prof-isContactWelcome">ℹ</span></label>
          <select id="profIsContactWelcome">
            <option value="true">声掛け歓迎</option>
            <option value="false">閲覧のみ</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>メインカテゴリ（複数選択可・最低1つ） * <span class="info-icon" id="tip-prof-category">ℹ</span></label>
        <div id="profCategoryContainer" class="checkbox-group"></div>
      </div>

      <div class="form-group">
        <label>属性・作風タグ（複数選択可・最低1つ） * <span class="info-icon" id="tip-prof-tags">ℹ</span></label>
        <div id="profTagsContainer" class="checkbox-group"></div>
      </div>

      <div class="form-group">
        <label>フリータグ（カンマ区切り） <span class="info-icon" id="tip-prof-freeTags">ℹ</span></label>
        <input type="text" id="profFreeTags" placeholder="例: 青年声, SF好き, 短納期相談可">
      </div>

      <div class="form-group" id="profPriceGuideGroup">
        <label>料金目安（クリエイター） * <span class="info-icon" id="tip-prof-priceGuide">ℹ</span></label>
        <select id="profPriceGuide"></select>
      </div>

      <hr class="section-divider">

      <div class="form-group">
        <label>アイコン画像URL <span class="info-icon" id="tip-prof-avatarUrl">ℹ</span></label>
        <input type="text" id="profAvatarUrl" placeholder="https://...（Googleドライブリンク可）" oninput="updateImagePreview('profAvatarUrl', 'profAvatarPreview', false)">
        <div id="profAvatarPreview" class="img-preview-box">
          <img src="" alt="アイコンプレビュー">
          <span>アイコン表示プレビュー</span>
        </div>
      </div>

      <div class="form-group">
        <label>自己紹介・アピール文 <span class="info-icon" id="tip-prof-description">ℹ</span></label>
        <textarea id="profDescription"></textarea>
      </div>

      <div class="form-group">
        <label>連絡先窓口 <span class="info-icon" id="tip-prof-contactInfo">ℹ</span></label>
        <input type="text" id="profContactInfo" placeholder="例: XのDM / contact@example.com">
      </div>

      <div class="form-group">
        <label>X (Twitter) URL</label>
        <input type="text" id="profXUrl" placeholder="https://x.com/ユーザー名">
      </div>

      <div class="form-group">
        <label>ポートフォリオ・個人HP <span class="info-icon" id="tip-prof-portfolioUrl">ℹ</span></label>
        <input type="text" id="profPortfolioUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>代表作品URL（最大4枠） <span class="info-icon" id="tip-prof-workUrls">ℹ</span></label>
        <input type="text" id="profWork1" placeholder="作品URL 1（Googleドライブリンク可）" style="margin-bottom:6px;" oninput="updateImagePreview('profWork1', 'profWork1Preview', true)">
        <div id="profWork1Preview" class="img-preview-box square" style="margin-bottom:8px;"><img src="" alt="プレビュー"><span>作品1 プレビュー</span></div>

        <input type="text" id="profWork2" placeholder="作品URL 2（Googleドライブリンク可）" style="margin-bottom:6px;" oninput="updateImagePreview('profWork2', 'profWork2Preview', true)">
        <div id="profWork2Preview" class="img-preview-box square" style="margin-bottom:8px;"><img src="" alt="プレビュー"><span>作品2 プレビュー</span></div>

        <input type="text" id="profWork3" placeholder="作品URL 3（Googleドライブリンク可）" style="margin-bottom:6px;" oninput="updateImagePreview('profWork3', 'profWork3Preview', true)">
        <div id="profWork3Preview" class="img-preview-box square" style="margin-bottom:8px;"><img src="" alt="プレビュー"><span>作品3 プレビュー</span></div>

        <input type="text" id="profWork4" placeholder="作品URL 4（Googleドライブリンク可）" oninput="updateImagePreview('profWork4', 'profWork4Preview', true)">
        <div id="profWork4Preview" class="img-preview-box square"><img src="" alt="プレビュー"><span>作品4 プレビュー</span></div>
      </div>

      <div class="form-group">
        <label>活動プラットフォーム（最大3枠） <span class="info-icon" id="tip-prof-platformUrls">ℹ</span></label>
        <input type="text" id="profPlatform1" placeholder="例: YouTubeチャンネルURL" style="margin-bottom:6px;">
        <input type="text" id="profPlatform2" placeholder="例: Twitch / Skeb URL" style="margin-bottom:6px;">
        <input type="text" id="profPlatform3" placeholder="例: BOOTH URL">
      </div>

      <button type="submit" class="btn-primary" id="saveBtn">変更内容を保存する</button>
      <button type="button" class="btn-logout" onclick="logout()">ログアウト</button>
    </form>
  </div>

  <div id="statusMsg" class="status-box"></div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyk1gWVq5JmKoz73D6zGB_k0WmpWgs4BGsH00J7WyewnW-iWAFzM6ORGOC4aR_ePRry4Q/exec";

  let sessionUser = null;
  let schemaData = null;
  let currentUserRole = "creator";

  window.addEventListener('DOMContentLoaded', async () => {
    const stored = sessionStorage.getItem('castelier_session');
    if (!stored) {
      window.location.href = './index.html';
      return;
    }
    sessionUser = JSON.parse(stored);

    try {
      const [schemaRes, userRes] = await Promise.all([
        fetch('./schema/accounts.yaml').then(r => r.text()),
        fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'login',
            data: { userId: sessionUser.userId, password: sessionUser.password }
          }),
          redirect: 'follow'
        }).then(r => r.json())
      ]);

      const loaded = jsyaml.load(schemaRes);
      schemaData = loaded.accounts.columns;

      if (userRes.success) {
        initForm(userRes.userData);
        setupTooltipToggle();
      } else {
        alert('セッションの有効期限が切れたか、認証に失敗しました。再ログインしてください。');
        logout();
      }
    } catch (err) {
      console.error(err);
      showStatus('データの読み込みに失敗しました: ' + err.message, false);
    }
  });

  function initForm(userData) {
    document.getElementById('loadingView').classList.add('hidden');
    document.getElementById('mainFormView').classList.remove('hidden');
    document.getElementById('displayUserId').textContent = `ID: ${userData.userId}`;

    applyInfoTips('prof');

    currentUserRole = userData.role || 'creator';
    const isStreamer = currentUserRole === 'streamer';
    document.getElementById('profRole').value = currentUserRole;

    // タグ一覧
    const tagsContainer = document.getElementById('profTagsContainer');
    tagsContainer.innerHTML = schemaData.tags.options.map((val, i) => `
      <label class="checkbox-label">
        <input type="checkbox" name="profTag" value="${val}">
        <span>${schemaData.tags.optionLabels[i] || val}</span>
      </label>
    `).join('');

    // 料金目安一覧
    const priceSelect = document.getElementById('profPriceGuide');
    priceSelect.innerHTML = schemaData.priceGuide.options.map((val, i) => `
      <option value="${val}">${schemaData.priceGuide.optionLabels[i] || val}</option>
    `).join('');

    // カテゴリ一覧
    const catContainer = document.getElementById('profCategoryContainer');
    const categories = schemaData.category.options[currentUserRole] || [];
    const catLabels = schemaData.category.optionLabels[currentUserRole] || [];
    catContainer.innerHTML = categories.map((val, i) => `
      <label class="checkbox-label">
        <input type="checkbox" name="profCategory" value="${val}">
        <span>${catLabels[i] || val}</span>
      </label>
    `).join('');

    // 出し分け制御
    if (isStreamer) {
      document.getElementById('profStreamerSettingsGroup').classList.remove('hidden');
      document.getElementById('profPriceGuideGroup').classList.add('hidden');
      document.getElementById('profIsPublic').value = String(userData.isPublic) === 'false' ? 'false' : 'true';
      document.getElementById('profIsContactWelcome').value = String(userData.isContactWelcome) === 'false' ? 'false' : 'true';
      handlePublicChange('prof');
    } else {
      document.getElementById('profStreamerSettingsGroup').classList.add('hidden');
      document.getElementById('profPriceGuideGroup').classList.remove('hidden');
      document.getElementById('profPriceGuide').value = userData.priceGuide || '';
    }

    document.getElementById('profDisplayName').value = userData.displayName || '';
    setCheckedValues('profCategory', userData.category);
    setCheckedValues('profTag', userData.tags);
    document.getElementById('profFreeTags').value = userData.freeTags || '';

    document.getElementById('profAvatarUrl').value = userData.avatarUrl || '';
    document.getElementById('profDescription').value = userData.description || '';
    document.getElementById('profContactInfo').value = userData.contactInfo || '';
    document.getElementById('profXUrl').value = userData.xUrl || '';
    document.getElementById('profPortfolioUrl').value = userData.portfolioUrl || '';
    document.getElementById('profWork1').value = userData['workUrls-1'] || '';
    document.getElementById('profWork2').value = userData['workUrls-2'] || '';
    document.getElementById('profWork3').value = userData['workUrls-3'] || '';
    document.getElementById('profWork4').value = userData['workUrls-4'] || '';
    document.getElementById('profPlatform1').value = userData['platformUrls-1'] || '';
    document.getElementById('profPlatform2').value = userData['platformUrls-2'] || '';
    document.getElementById('profPlatform3').value = userData['platformUrls-3'] || '';
    // 既存画像のプレビュー初期表示
    updateImagePreview('profAvatarUrl', 'profAvatarPreview', false);
    updateImagePreview('profWork1', 'profWork1Preview', true);
    updateImagePreview('profWork2', 'profWork2Preview', true);
    updateImagePreview('profWork3', 'profWork3Preview', true);
    updateImagePreview('profWork4', 'profWork4Preview', true);
  }

  function applyInfoTips(prefix) {
    Object.keys(schemaData).forEach(key => {
      const el = document.getElementById(`tip-${prefix}-${key}`);
      if (el && schemaData[key].infoTip) {
        el.setAttribute('data-tooltip', schemaData[key].infoTip);
      }
    });
  }

  function handlePublicChange(prefix) {
    const isPublic = document.getElementById(`${prefix}IsPublic`).value === 'true';
    const contactSelect = document.getElementById(`${prefix}IsContactWelcome`);
    if (!isPublic) {
      contactSelect.disabled = true;
      contactSelect.value = 'false';
    } else {
      contactSelect.disabled = false;
    }
  }

  function getCheckedValues(name) {
    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
  }

  function setCheckedValues(name, commaValues) {
    const arr = (commaValues || '').split(',').map(s => s.trim());
    document.querySelectorAll(`input[name="${name}"]`).forEach(cb => {
      cb.checked = arr.includes(cb.value);
    });
  }

  function showStatus(msg, isSuccess) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = `status-box ${isSuccess ? 'success' : 'error'}`;
    el.style.display = 'block';
  }

  function hideStatus() {
    document.getElementById('statusMsg').style.display = 'none';
  }

  // プロフィール更新処理
  async function handleUpdate(e) {
    e.preventDefault();
    hideStatus();

    const displayName = document.getElementById('profDisplayName').value.trim();
    if (displayName.length > 30) {
      showStatus('活動名は30文字以内で入力してください。', false);
      return;
    }

    const xUrl = document.getElementById('profXUrl').value.trim();
    if (xUrl && !/^https:\/\/(twitter\.com|x\.com)\/[a-zA-Z0-9_]+$/i.test(xUrl)) {
      showStatus('X (Twitter) URLは「https://x.com/ユーザー名」の形式で入力してください。', false);
      return;
    }

    const selectedCategories = getCheckedValues('profCategory');
    const selectedTags = getCheckedValues('profTag');

    if (selectedCategories.length === 0) {
      showStatus('メインカテゴリを最低1つ選択してください。', false);
      return;
    }
    if (selectedTags.length === 0) {
      showStatus('属性・作風タグを最低1つ選択してください。', false);
      return;
    }

    // GoogleドライブURLの検証と自動変換
    const rawAvatar = document.getElementById('profAvatarUrl').value;
    if (rawAvatar && !isValidImageUrl(rawAvatar)) {
      showStatus('アイコンURLには画像直リンク（.jpg/.png等）またはGoogleドライブの共有リンクを入力してください。', false);
      return;
    }
    const cleanedAvatarUrl = normalizeDriveUrl(rawAvatar, 'image');
    const cleanedWork1 = normalizeDriveUrl(document.getElementById('profWork1').value, 'preview');
    const cleanedWork2 = normalizeDriveUrl(document.getElementById('profWork2').value, 'preview');
    const cleanedWork3 = normalizeDriveUrl(document.getElementById('profWork3').value, 'preview');
    const cleanedWork4 = normalizeDriveUrl(document.getElementById('profWork4').value, 'preview');

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '保存中...';

    const isStreamer = currentUserRole === 'streamer';
    const isPublic = isStreamer ? (document.getElementById('profIsPublic').value === 'true') : true;
    const isContactWelcome = (isStreamer && isPublic) ? (document.getElementById('profIsContactWelcome').value === 'true') : (!isStreamer ? true : false);

    const payload = {
      action: 'update',
      data: {
        userId: sessionUser.userId,
        password: sessionUser.password,
        displayName: document.getElementById('profDisplayName').value.trim(),
        isPublic: isPublic,
        isContactWelcome: isContactWelcome,
        category: selectedCategories.join(','),
        tags: selectedTags.join(','),
        freeTags: document.getElementById('profFreeTags').value.trim(),
        priceGuide: !isStreamer ? document.getElementById('profPriceGuide').value : '',
        avatarUrl: cleanedAvatarUrl,
        description: document.getElementById('profDescription').value,
        contactInfo: document.getElementById('profContactInfo').value.trim(),
        xUrl: document.getElementById('profXUrl').value.trim(),
        portfolioUrl: document.getElementById('profPortfolioUrl').value.trim(),
        'workUrls-1': cleanedWork1,
        'workUrls-2': cleanedWork2,
        'workUrls-3': cleanedWork3,
        'workUrls-4': cleanedWork4,
        'platformUrls-1': document.getElementById('profPlatform1').value.trim(),
        'platformUrls-2': document.getElementById('profPlatform2').value.trim(),
        'platformUrls-3': document.getElementById('profPlatform3').value.trim()
      }
    };

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const data = await res.json();

      if (data.success) {
        showStatus('プロフィール情報を保存・更新しました！', true);
      } else {
        showStatus(data.message || '更新に失敗しました。', false);
      }
    } catch (err) {
      console.error(err);
      showStatus('通信エラーが発生しました: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = '変更内容を保存する';
    }
  }

  function logout() {
    sessionStorage.removeItem('castelier_session');
    window.location.href = './index.html';
  }

  // ユーティリティ関数
  function normalizeDriveUrl(url, type = 'image') {
    if (!url || typeof url !== 'string') return '';
    const trimmed = url.trim();
    const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]{25,})/;
    const match = trimmed.match(driveRegex);
    if (match && match[1]) {
      const fileId = match[1];
      return type === 'image'
        ? `https://lh3.googleusercontent.com/d/${fileId}`
        : `https://drive.google.com/file/d/${fileId}/preview`;
    }
    return trimmed;
  }

  function isValidImageUrl(url) {
    if (!url) return true;
    const trimmed = url.trim();
    if (/drive\.google\.com/.test(trimmed)) return true;
    const isDirectImage = /\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i.test(trimmed);
    const isHttps = /^https?:\/\//i.test(trimmed);
    return isHttps && (isDirectImage || trimmed.includes('googleusercontent.com'));
  }

  // リアルタイム画像プレビュー更新
  function updateImagePreview(inputId, previewBoxId, isSquare = false) {
    const input = document.getElementById(inputId);
    const box = document.getElementById(previewBoxId);
    const img = box.querySelector('img');
    const rawVal = input.value.trim();

    if (!rawVal) {
      box.style.display = 'none';
      img.src = '';
      return;
    }

    const converted = normalizeDriveUrl(rawVal, 'image');
    if (isValidImageUrl(rawVal)) {
      img.src = converted;
      img.onload = () => { box.style.display = 'flex'; };
      img.onerror = () => { box.style.display = 'none'; };
    } else {
      box.style.display = 'none';
    }
  }

  // ツールチップのタップ開閉制御（スマホ・PC共通）
  function setupTooltipToggle() {
    document.addEventListener('click', (e) => {
      const targetIcon = e.target.closest('.info-icon');

      // 他の開いているツールチップをすべて閉じる
      document.querySelectorAll('.info-icon.active').forEach(icon => {
        if (icon !== targetIcon) {
          icon.classList.remove('active');
        }
      });

      // タップしたアイコンの表示/非表示を切り替え
      if (targetIcon) {
        targetIcon.classList.toggle('active');
      }
    });
  }
</script>
