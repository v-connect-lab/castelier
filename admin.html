<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Connect Platform | 管理ダッシュボード</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .lead { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 24px; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-sub);
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--primary); font-weight: bold; border-bottom-color: var(--primary); }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
    .hint { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }
    
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }
    textarea { resize: vertical; min-height: 80px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-toggle { display: flex; gap: 16px; margin: 8px 0; }

    button.btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background-color: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      padding: 12px;
      margin-top: 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      display: none;
    }
    .status-box.success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-box.error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .hidden { display: none; }
    .user-badge { background: #e0e7ff; color: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <!-- 認証エリア（ログイン / 新規登録） -->
  <div id="authSection">
    <h1>V-Connect Platform 管理画面</h1>
    <p class="lead">アカウント作成またはログインしてプロフィールを設定してください。</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchAuthTab('login')">ログイン</button>
      <button class="tab-btn" onclick="switchAuthTab('register')">新規登録</button>
    </div>

    <!-- ログインフォーム -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>ユーザーID</label>
        <input type="text" id="loginUserId" placeholder="usr_xxxxxxxx" required>
      </div>
      <div class="form-group">
        <label>編集パスコード</label>
        <input type="password" id="loginPassword" placeholder="登録時に決めたパスコード" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">ログイン</button>
    </form>

    <!-- 新規登録フォーム -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>ユーザー区分</label>
        <select id="regRole" required>
          <option value="creator">クリエイター（イラスト / Live2D / 動画 / 音楽 / Web等）</option>
          <option value="streamer">配信者（個人VTuber / Vライバー / 配信活動者等）</option>
        </select>
      </div>
      <div class="form-group">
        <label>活動名（表示名）</label>
        <input type="text" id="regDisplayName" placeholder="ニックネーム" required>
      </div>
      <div class="form-group">
        <label>編集パスコード（英数字）</label>
        <input type="password" id="regPassword" placeholder="編集・ログイン時に使う合言葉" required>
        <div class="hint">次回以降のログイン・編集に必要になります。忘れないよう控えておいてください。</div>
      </div>
      <button type="submit" class="btn-primary" id="regBtn">登録して管理画面へ進む</button>
    </form>
  </div>

  <!-- ダッシュボード（プロフィール編集エリア） -->
  <div id="dashboardSection" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h1>プロフィール編集</h1>
      <span class="user-badge" id="displayUserId"></span>
    </div>
    <p class="lead">登録情報はスプレッドシートおよびプラットフォームに即時同期されます。</p>

    <form id="profileForm" onsubmit="handleUpdate(event)">
      <div class="grid-2">
        <div class="form-group">
          <label>活動名（表示名）</label>
          <input type="text" id="profDisplayName" required>
        </div>
        <div class="form-group">
          <label>メインカテゴリ</label>
          <input type="text" id="profCategory" placeholder="例: イラスト / 作曲・MIX / Web制作 / Live2D / 準備中VTuber">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>公開設定</label>
          <select id="profIsPublic">
            <option value="true">公開（リストに表示）</option>
            <option value="false">非公開（ステルスモード）</option>
          </select>
        </div>
        <div class="form-group">
          <label>お声がけ歓迎設定</label>
          <select id="profIsContactWelcome">
            <option value="true">お声がけ歓迎！</option>
            <option value="false">閲覧のみ（声かけ不要）</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>属性・作風タグ（カンマ区切り）</label>
        <input type="text" id="profTags" placeholder="和風, かわいい, SD, 厚塗り">
      </div>

      <div class="form-group">
        <label>アイコン画像URL</label>
        <input type="text" id="profAvatarUrl" placeholder="Googleドライブの共有URL等">
      </div>

      <div class="form-group">
        <label>代表作品URL（最大4枠）</label>
        <input type="text" id="profWork1" placeholder="作品URL 1 (ドライブ共有リンクやYouTube)" style="margin-bottom:6px;">
        <input type="text" id="profWork2" placeholder="作品URL 2" style="margin-bottom:6px;">
        <input type="text" id="profWork3" placeholder="作品URL 3" style="margin-bottom:6px;">
        <input type="text" id="profWork4" placeholder="作品URL 4">
      </div>

      <div class="form-group">
        <label>X (Twitter) プロフィールURL</label>
        <input type="text" id="profXUrl" placeholder="https://x.com/ユーザー名">
      </div>

      <div class="form-group">
        <label>活動プラットフォーム（最大3枠）</label>
        <input type="text" id="profPlatform1" placeholder="例: YouTubeチャンネルURL" style="margin-bottom:6px;">
        <input type="text" id="profPlatform2" placeholder="例: Skeb / Twitch URL" style="margin-bottom:6px;">
        <input type="text" id="profPlatform3" placeholder="例: BOOTH / IRIAM URL">
      </div>

      <div class="form-group">
        <label>ポートフォリオHP / 個人サイト</label>
        <input type="text" id="profPortfolioUrl" placeholder="foriio、lit.link、独自サイト等">
      </div>

      <div class="form-group">
        <label>連絡先窓口</label>
        <input type="text" id="profContactInfo" placeholder="例: XのDM / 連絡用メール / マシュマロ">
      </div>

      <div class="form-group">
        <label>自己紹介・アピール文</label>
        <textarea id="profDescription" placeholder="活動内容や世界観、求める制作について"></textarea>
      </div>

      <div class="form-group">
        <label>料金目安（クリエイター）/ 予算感（配信者・任意）</label>
        <input type="text" id="profPriceGuide" placeholder="例: 一枚絵 15,000円〜 / 予算 2万円前後">
      </div>

      <button type="submit" class="btn-primary" id="saveBtn">変更内容を保存する</button>
      <button type="button" onclick="logout()" style="width:100%; margin-top:8px; padding:8px; background:none; border:none; color:var(--text-sub); cursor:pointer;">ログアウト</button>
    </form>
  </div>

  <div id="statusMsg" class="status-box"></div>
</div>

<script>
  // 中継GASエンドポイント
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyk1gWVq5JmKoz73D6zGB_k0WmpWgs4BGsH00J7WyewnW-iWAFzM6ORGOC4aR_ePRry4Q/exec";

  // 認証状態のセッション保持
  let currentSession = {
    userId: "",
    password: ""
  };

  function switchAuthTab(type) {
    const isLogin = type === 'login';
    document.querySelectorAll('.tab-btn')[0].classList.toggle('active', isLogin);
    document.querySelectorAll('.tab-btn')[1].classList.toggle('active', !isLogin);
    document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
    document.getElementById('registerForm').classList.toggle('hidden', isLogin);
    hideStatus();
  }

  function showStatus(msg, isSuccess) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = `status-box ${isSuccess ? 'success' : 'error'}`;
    el.style.display = 'block';
  }

  function hideStatus() {
    document.getElementById('statusMsg').style.display = 'none';
  }

  // 1. 新規登録処理
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.textContent = '登録中...';
    hideStatus();

    const payload = {
      action: 'register',
      data: {
        role: document.getElementById('regRole').value,
        displayName: document.getElementById('regDisplayName').value,
        password: document.getElementById('regPassword').value,
        isPublic: true,
        isContactWelcome: true
      }
    };

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const data = await res.json();

      if (data.success) {
        showStatus(`登録完了！あなたのIDは【 ${data.userId} 】です。IDを控えてログインしてください。`, true);
        document.getElementById('loginUserId').value = data.userId;
        document.getElementById('loginPassword').value = payload.data.password;
        switchAuthTab('login');
      } else {
        showStatus(data.message || '登録に失敗しました。', false);
      }
    } catch (err) {
      console.error(err);
      showStatus('通信エラーが発生しました: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = '登録して管理画面へ進む';
    }
  }

  // 2. ログイン処理
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '照合中...';
    hideStatus();

    const userId = document.getElementById('loginUserId').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'login',
          data: { userId, password }
        }),
        redirect: 'follow'
      });
      const data = await res.json();

      if (data.success) {
        currentSession.userId = userId;
        currentSession.password = password;
        populateDashboard(data.userData);
      } else {
        showStatus(data.message || 'ログインに失敗しました。', false);
      }
    } catch (err) {
      console.error(err);
      showStatus('通信エラーが発生しました: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'ログイン';
    }
  }

  // 3. 更新保存処理
  async function handleUpdate(e) {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '保存中...';
    hideStatus();

    const payload = {
      action: 'update',
      data: {
        userId: currentSession.userId,
        password: currentSession.password,
        displayName: document.getElementById('profDisplayName').value,
        category: document.getElementById('profCategory').value,
        isPublic: document.getElementById('profIsPublic').value === 'true',
        isContactWelcome: document.getElementById('profIsContactWelcome').value === 'true',
        tags: document.getElementById('profTags').value,
        avatarUrl: document.getElementById('profAvatarUrl').value,
        'workUrls-1': document.getElementById('profWork1').value,
        'workUrls-2': document.getElementById('profWork2').value,
        'workUrls-3': document.getElementById('profWork3').value,
        'workUrls-4': document.getElementById('profWork4').value,
        xUrl: document.getElementById('profXUrl').value,
        'platformUrls-1': document.getElementById('profPlatform1').value,
        'platformUrls-2': document.getElementById('profPlatform2').value,
        'platformUrls-3': document.getElementById('profPlatform3').value,
        portfolioUrl: document.getElementById('profPortfolioUrl').value,
        contactInfo: document.getElementById('profContactInfo').value,
        description: document.getElementById('profDescription').value,
        priceGuide: document.getElementById('profPriceGuide').value
      }
    };

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const data = await res.json();

      if (data.success) {
        showStatus('プロフィールを保存・更新しました！', true);
      } else {
        showStatus(data.message || '更新に失敗しました。', false);
      }
    } catch (err) {
      console.error(err);
      showStatus('通信エラーが発生しました: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = '変更内容を保存する';
    }
  }
  // ダッシュボードへのデータ反映
  function populateDashboard(user) {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('dashboardSection').classList.remove('hidden');
    document.getElementById('displayUserId').textContent = `ID: ${user.userId}`;

    document.getElementById('profDisplayName').value = user.displayName || '';
    document.getElementById('profCategory').value = user.category || '';
    document.getElementById('profIsPublic').value = String(user.isPublic) === 'false' ? 'false' : 'true';
    document.getElementById('profIsContactWelcome').value = String(user.isContactWelcome) === 'false' ? 'false' : 'true';
    document.getElementById('profTags').value = user.tags || '';
    document.getElementById('profAvatarUrl').value = user.avatarUrl || '';
    document.getElementById('profWork1').value = user['workUrls-1'] || '';
    document.getElementById('profWork2').value = user['workUrls-2'] || '';
    document.getElementById('profWork3').value = user['workUrls-3'] || '';
    document.getElementById('profWork4').value = user['workUrls-4'] || '';
    document.getElementById('profXUrl').value = user.xUrl || '';
    document.getElementById('profPlatform1').value = user['platformUrls-1'] || '';
    document.getElementById('profPlatform2').value = user['platformUrls-2'] || '';
    document.getElementById('profPlatform3').value = user['platformUrls-3'] || '';
    document.getElementById('profPortfolioUrl').value = user.portfolioUrl || '';
    document.getElementById('profContactInfo').value = user.contactInfo || '';
    document.getElementById('profDescription').value = user.description || '';
    document.getElementById('profPriceGuide').value = user.priceGuide || '';
  }

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        showStatus('プロフィールを保存・更新しました！', true);
      } else {
        showStatus(data.message || '更新に失敗しました。', false);
      }
    } catch (err) {
      showStatus('通信エラーが発生しました。', false);
    } finally {
      btn.disabled = false;
      btn.textContent = '変更内容を保存する';
    }
  }

  function logout() {
    currentSession = { userId: "", password: "" };
    document.getElementById('dashboardSection').classList.add('hidden');
    document.getElementById('authSection').classList.remove('hidden');
    hideStatus();
  }
</script>
</body>
</html>
