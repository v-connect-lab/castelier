<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- AI学習抑止メタタグ -->
  <meta name="robots" content="noai, noimageai">
  
  <title>Castelier | ログイン・新規登録</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px 28px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    h1 { font-size: 1.5rem; margin-bottom: 6px; text-align: center; }
    .lead { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 24px; text-align: center; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--text-sub);
      border-bottom: 2px solid transparent;
      text-align: center;
    }
    .tab-btn.active { color: var(--primary); font-weight: bold; border-bottom-color: var(--primary); }

    .form-group { margin-bottom: 16px; }
    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    /* ツールチップ（インフォマーク） */
    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e2e8f0;
      color: var(--text-sub);
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .info-icon:hover::after,
    .info-icon.active::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: normal;
      white-space: normal;
      width: 240px;
      z-index: 50;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      line-height: 1.4;
      pointer-events: none;
    }
    
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }
    input:disabled, select:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    textarea { resize: vertical; min-height: 80px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fafafa;
    }
    .checkbox-label {
      font-size: 0.8rem;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-bottom: 0;
    }

    .toggle-password-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--text-sub);
      cursor: pointer;
    }

    button.btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background-color: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      padding: 12px;
      margin-top: 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      display: none;
    }
    .status-box.success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-box.error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .hidden { display: none !important; }
    .section-divider { border: 0; border-top: 1px dashed var(--border); margin: 20px 0; }

    /* アイコンプレビュー */
    .img-preview-box {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 12px;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .img-preview-box img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 1px solid var(--border);
    }
    .img-preview-box span {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* 利用規約チェック */
    .terms-box {
      margin: 20px 0 16px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.85rem;
    }
    .terms-box label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
      font-weight: normal;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Castelier（キャストリエ）</h1>
  <p class="lead">アカウント作成またはログインしてプラットフォームをご利用ください。</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="switchAuthTab('login')">ログイン</button>
    <button type="button" class="tab-btn" onclick="switchAuthTab('register')">新規登録</button>
  </div>

  <!-- ログインフォーム -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>ユーザーID <span class="info-icon" id="tip-login-userId" data-tooltip="登録時に発行された固有IDです">ℹ</span></label>
      <input type="text" id="loginUserId" placeholder="usr_xxxxxxxx" required>
    </div>
    <div class="form-group">
      <label>パスワード <span class="info-icon" id="tip-login-password" data-tooltip="登録時のパスワードです">ℹ</span></label>
      <input type="password" id="loginPassword" placeholder="パスワードを入力" required>
      <label class="toggle-password-wrap">
        <input type="checkbox" onchange="togglePasswordVisibility(['loginPassword'], this.checked)">
        パスワードを表示
      </label>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">ログイン</button>
  </form>

  <!-- 新規登録フォーム -->
  <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label>ユーザー区分 * <span class="info-icon" id="tip-reg-role">ℹ</span></label>
      <select id="regRole" required onchange="handleRoleChange()">
        <option value="creator">クリエイター</option>
        <option value="streamer">配信者</option>
      </select>
    </div>

    <div class="form-group">
      <label>活動名（表示名） * <span class="info-icon" id="tip-reg-displayName">ℹ</span></label>
      <input type="text" id="regDisplayName" placeholder="ニックネーム" required>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>パスワード * <span class="info-icon" id="tip-reg-password">ℹ</span></label>
        <input type="password" id="regPassword" placeholder="英数字パスワード" required>
      </div>
      <div class="form-group">
        <label>パスワード（確認用） *</label>
        <input type="password" id="regPasswordConfirm" placeholder="もう一度入力" required>
      </div>
    </div>
    <div style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true" tabindex="-1">
      <label for="regWebsiteUrl">Website Confirm</label>
      <input type="text" id="regWebsiteUrl" name="regWebsiteUrl" autocomplete="off">
    </div>
    <label class="toggle-password-wrap" style="margin-top:-8px; margin-bottom:16px;">
      <input type="checkbox" onchange="togglePasswordVisibility(['regPassword', 'regPasswordConfirm'], this.checked)">
      パスワードを表示
    </label>

    <!-- 配信者のみ表示する設定 -->
    <div class="grid-2 hidden" id="regStreamerSettingsGroup">
      <div class="form-group">
        <label>公開設定 <span class="info-icon" id="tip-reg-isPublic">ℹ</span></label>
        <select id="regIsPublic" onchange="handlePublicChange('reg')">
          <option value="true">公開</option>
          <option value="false">非公開</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lbl-regIsContactWelcome">お声がけ歓迎設定 <span class="info-icon" id="tip-reg-isContactWelcome">ℹ</span></label>
        <select id="regIsContactWelcome">
          <option value="true">声掛け歓迎</option>
          <option value="false">閲覧のみ</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>メインカテゴリ（複数選択可・最低1つ） * <span class="info-icon" id="tip-reg-category">ℹ</span></label>
      <div id="regCategoryContainer" class="checkbox-group"></div>
    </div>

    <div class="form-group">
      <label>属性・作風タグ（複数選択可・最低1つ） * <span class="info-icon" id="tip-reg-tags">ℹ</span></label>
      <div id="regTagsContainer" class="checkbox-group"></div>
    </div>

    <div class="form-group">
      <label>フリータグ（カンマ区切り） <span class="info-icon" id="tip-reg-freeTags">ℹ</span></label>
      <input type="text" id="regFreeTags" placeholder="例: 青年声, SF好き, 短納期相談可">
    </div>

    <div class="form-group" id="regPriceGuideGroup">
      <label>料金目安（クリエイター） * <span class="info-icon" id="tip-reg-priceGuide">ℹ</span></label>
      <select id="regPriceGuide"></select>
    </div>

    <hr class="section-divider">

    <div class="form-group">
      <label>アイコン画像URL <span class="info-icon" id="tip-reg-avatarUrl">ℹ</span></label>
      <input type="text" id="regAvatarUrl" placeholder="https://...（Googleドライブリンク可）" oninput="updateImagePreview('regAvatarUrl', 'avatarPreview')">
      <div id="avatarPreview" class="img-preview-box">
        <img src="" alt="アイコンプレビュー">
        <span>アイコン表示プレビュー</span>
      </div>
    </div>

    <div class="form-group">
      <label>自己紹介・アピール文 <span class="info-icon" id="tip-reg-description">ℹ</span></label>
      <textarea id="regDescription" placeholder="活動内容や依頼時の希望など">よろしくお願いします。</textarea>
    </div>

    <div class="form-group">
      <label>連絡先窓口 <span class="info-icon" id="tip-reg-contactInfo">ℹ</span></label>
      <input type="text" id="regContactInfo" placeholder="例: XのDM / contact@example.com">
    </div>

    <div class="form-group">
      <label>X (Twitter) URL</label>
      <input type="text" id="regXUrl" placeholder="https://x.com/ユーザー名">
    </div>

    <div class="form-group">
      <label>ポートフォリオ・個人HP <span class="info-icon" id="tip-reg-portfolioUrl">ℹ</span></label>
      <input type="text" id="regPortfolioUrl" placeholder="https://...">
    </div>

    <!-- 代表作品URL（最大4枠） -->
    <div class="form-group">
      <label>代表作品（最大4枠） <span class="info-icon" id="tip-reg-works" data-tooltip="画像、音楽、動画、Webサイトの作品を最大4枠まで登録できます。">ℹ</span></label>
      <div id="regWorksContainer">
        <!-- 枠 1 -->
        <div class="reg-work-block" style="border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; background: #fafafa;">
          <div class="grid-2" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
            <select class="reg-work-type" onchange="toggleWorkImageInput(this)">
              <option value="image">画像</option>
              <option value="music">音楽・音声</option>
              <option value="video">動画</option>
              <option value="web">Webサイト</option>
            </select>
            <input type="text" class="reg-work-url" placeholder="作品URL 1（Googleドライブ可）">
          </div>
          <div class="reg-work-image-wrap hidden">
            <input type="text" class="reg-work-image" placeholder="サムネイル・ジャケット画像URL（任意・Googleドライブ可）">
          </div>
        </div>

        <!-- 枠 2 -->
        <div class="reg-work-block" style="border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; background: #fafafa;">
          <div class="grid-2" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
            <select class="reg-work-type" onchange="toggleWorkImageInput(this)">
              <option value="image">画像</option>
              <option value="music">音楽・音声</option>
              <option value="video">動画</option>
              <option value="web">Webサイト</option>
            </select>
            <input type="text" class="reg-work-url" placeholder="作品URL 2">
          </div>
          <div class="reg-work-image-wrap hidden">
            <input type="text" class="reg-work-image" placeholder="サムネイル・ジャケット画像URL（任意・Googleドライブ可）">
          </div>
        </div>

        <!-- 枠 3 -->
        <div class="reg-work-block" style="border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; background: #fafafa;">
          <div class="grid-2" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
            <select class="reg-work-type" onchange="toggleWorkImageInput(this)">
              <option value="image">画像</option>
              <option value="music">音楽・音声</option>
              <option value="video">動画</option>
              <option value="web">Webサイト</option>
            </select>
            <input type="text" class="reg-work-url" placeholder="作品URL 3">
          </div>
          <div class="reg-work-image-wrap hidden">
            <input type="text" class="reg-work-image" placeholder="サムネイル・ジャケット画像URL（任意・Googleドライブ可）">
          </div>
        </div>

        <!-- 枠 4 -->
        <div class="reg-work-block" style="border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; background: #fafafa;">
          <div class="grid-2" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
            <select class="reg-work-type" onchange="toggleWorkImageInput(this)">
              <option value="image">画像</option>
              <option value="music">音楽・音声</option>
              <option value="video">動画</option>
              <option value="web">Webサイト</option>
            </select>
            <input type="text" class="reg-work-url" placeholder="作品URL 4">
          </div>
          <div class="reg-work-image-wrap hidden">
            <input type="text" class="reg-work-image" placeholder="サムネイル・ジャケット画像URL（任意・Googleドライブ可）">
          </div>
        </div>
      </div>
    </div>

    <!-- 活動プラットフォーム（最大3枠） -->
    <div class="form-group">
      <label>活動プラットフォーム（最大3枠） <span class="info-icon" id="tip-reg-platforms" data-tooltip="YouTube、Twitch、BOOTHなどのリンク先と表示名を入力できます。">ℹ</span></label>
      <div id="regPlatformsContainer">
        <div class="grid-2 reg-platform-row" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
          <input type="text" class="reg-platform-label" placeholder="例: YouTube">
          <input type="text" class="reg-platform-url" placeholder="https://...">
        </div>
        <div class="grid-2 reg-platform-row" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
          <input type="text" class="reg-platform-label" placeholder="例: Twitch">
          <input type="text" class="reg-platform-url" placeholder="https://...">
        </div>
        <div class="grid-2 reg-platform-row" style="grid-template-columns: 140px 1fr; margin-bottom: 6px;">
          <input type="text" class="reg-platform-label" placeholder="例: BOOTH">
          <input type="text" class="reg-platform-url" placeholder="https://...">
        </div>
      </div>
    </div>

    <div class="terms-box">
      <label style="cursor: pointer;">
        <input type="checkbox" id="regAgreeTerms" disabled required>
        <span>
          <a href="./terms.html" target="_blank" id="termsLink" style="color: var(--primary); text-decoration: underline; font-weight: 600;">無断転載・自作発言の禁止、健全な交流ガイドライン</a>
          を確認し、同意する *
        </span>
      </label>
      <div id="termsNotice" style="font-size: 0.75rem; color: #ef4444; margin-top: 6px; padding-left: 24px;">
        ※リンク先を開いて規約内容を確認するとチェック可能になります。
      </div>
    </div>

    <p class="lead" style="margin-bottom: 20px; line-height: 1.6;">
      <span style="color: #ef4444; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-top: 4px;">
        ⚠️ 登録から3日以内に「アイコン画像」と「自己紹介文（初期値からの変更）」が設定されない場合、一覧への掲載が一時停止されます（再設定で復帰します）。
      </span>
    </p>

    <button type="submit" class="btn-primary" id="regBtn">登録してTOPへ進む</button>
  </form>

  <div id="statusMsg" class="status-box"></div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyk1gWVq5JmKoz73D6zGB_k0WmpWgs4BGsH00J7WyewnW-iWAFzM6ORGOC4aR_ePRry4Q/exec";

  let schemaData = null;

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('./schema/accounts.yaml');
      const yamlText = await res.text();
      const loaded = jsyaml.load(yamlText);
      schemaData = loaded.accounts.columns;
      initUiFromSchema();
      setupTooltipToggle();
      setupTermsUnlock();
    } catch (e) {
      console.error('YAMLスキーマ読み込み失敗:', e);
      showStatus('スキーマファイルの読み込みに失敗しました。', false);
    }
  });

  function initUiFromSchema() {
    if (!schemaData) return;
    applyInfoTips('reg');
    renderCheckboxes('regTagsContainer', 'regTag', schemaData.tags.options, schemaData.tags.optionLabels);
    renderSelect('regPriceGuide', schemaData.priceGuide.options, schemaData.priceGuide.optionLabels);
    handleRoleChange();
  }

  function applyInfoTips(prefix) {
    Object.keys(schemaData).forEach(key => {
      const el = document.getElementById(`tip-${prefix}-${key}`);
      if (el && schemaData[key].infoTip) {
        el.setAttribute('data-tooltip', schemaData[key].infoTip);
      }
    });
  }

  function renderCheckboxes(containerId, namePrefix, values, labels) {
    const el = document.getElementById(containerId);
    el.innerHTML = values.map((val, i) => `
      <label class="checkbox-label">
        <input type="checkbox" name="${namePrefix}" value="${val}">
        <span>${labels[i] || val}</span>
      </label>
    `).join('');
  }

  function renderSelect(selectId, values, labels) {
    const el = document.getElementById(selectId);
    el.innerHTML = values.map((val, i) => `
      <option value="${val}">${labels[i] || val}</option>
    `).join('');
  }

  function handleRoleChange() {
    if (!schemaData) return;
    const role = document.getElementById('regRole').value;
    const container = document.getElementById('regCategoryContainer');
    const priceGroup = document.getElementById('regPriceGuideGroup');
    const streamerGroup = document.getElementById('regStreamerSettingsGroup');

    const categories = schemaData.category.options[role] || [];
    const labels = schemaData.category.optionLabels[role] || [];
    container.innerHTML = categories.map((val, i) => `
      <label class="checkbox-label">
        <input type="checkbox" name="regCategory" value="${val}">
        <span>${labels[i] || val}</span>
      </label>
    `).join('');

    if (role === 'creator') {
      priceGroup.classList.remove('hidden');
      streamerGroup.classList.add('hidden');
    } else {
      priceGroup.classList.add('hidden');
      streamerGroup.classList.remove('hidden');
      handlePublicChange('reg');
    }
  }

  function handlePublicChange(prefix) {
    const isPublic = document.getElementById(`${prefix}IsPublic`).value === 'true';
    const contactSelect = document.getElementById(`${prefix}IsContactWelcome`);
    if (!isPublic) {
      contactSelect.disabled = true;
      contactSelect.value = 'false';
    } else {
      contactSelect.disabled = false;
    }
  }

  function toggleWorkImageInput(selectEl) {
    const block = selectEl.closest('.reg-work-block');
    const imageWrap = block.querySelector('.reg-work-image-wrap');
    const val = selectEl.value;

    if (val === 'music' || val === 'web') {
      imageWrap.classList.remove('hidden');
    } else {
      imageWrap.classList.add('hidden');
      block.querySelector('.reg-work-image').value = '';
    }
  }

  function togglePasswordVisibility(fieldIds, isVisible) {
    fieldIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.type = isVisible ? 'text' : 'password';
    });
  }

  function getCheckedValues(name) {
    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
  }

  function switchAuthTab(type) {
    const isLogin = type === 'login';
    document.querySelectorAll('.tab-btn')[0].classList.toggle('active', isLogin);
    document.querySelectorAll('.tab-btn')[1].classList.toggle('active', !isLogin);
    document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
    document.getElementById('registerForm').classList.toggle('hidden', isLogin);
    hideStatus();
  }

  function showStatus(msg, isSuccess) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = `status-box ${isSuccess ? 'success' : 'error'}`;
    el.style.display = 'block';
  }

  function hideStatus() {
    document.getElementById('statusMsg').style.display = 'none';
  }

  // 新規登録処理（スプレッドシートの各列名に合わせてフラットに送信）
  async function handleRegister(e) {
    e.preventDefault();
    hideStatus();

    const honeypot = document.getElementById('regWebsiteUrl').value;
    if (honeypot) {
      console.warn('Bot detected by honeypot.');
      alert('登録が完了しました！');
      return;
    }

    if (!document.getElementById('regAgreeTerms').checked) {
      showStatus('ガイドラインへの同意が必要です。', false);
      return;
    }

    const displayName = document.getElementById('regDisplayName').value.trim();
    if (displayName.length > 30) {
      showStatus('活動名は30文字以内で入力してください。', false);
      return;
    }

    const pwd = document.getElementById('regPassword').value;
    const pwdConfirm = document.getElementById('regPasswordConfirm').value;
    if (pwd !== pwdConfirm) {
      showStatus('確認用パスワードが一致しません。もう一度ご確認ください。', false);
      return;
    }

    const xUrl = document.getElementById('regXUrl').value.trim();
    if (xUrl && !/^https:\/\/(twitter\.com|x\.com)\/[a-zA-Z0-9_]+$/i.test(xUrl)) {
      showStatus('X (Twitter) URLは「https://x.com/ユーザー名」の形式で入力してください。', false);
      return;
    }

    const selectedCategories = getCheckedValues('regCategory');
    const selectedTags = getCheckedValues('regTag');

    if (selectedCategories.length === 0) {
      showStatus('メインカテゴリを最低1つ選択してください。', false);
      return;
    }
    if (selectedTags.length === 0) {
      showStatus('属性・作風タグを最低1つ選択してください。', false);
      return;
    }

    const rawAvatar = document.getElementById('regAvatarUrl').value;
    if (rawAvatar && !isValidImageUrl(rawAvatar)) {
      showStatus('アイコンURLには画像直リンク（.jpg/.png等）またはGoogleドライブの共有リンクを入力してください。', false);
      return;
    }
    const cleanedAvatarUrl = normalizeDriveUrl(rawAvatar, 'image');

    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.textContent = '登録中...';

    const role = document.getElementById('regRole').value;
    const isStreamer = role === 'streamer';
    const isPublic = isStreamer ? (document.getElementById('regIsPublic').value === 'true') : true;
    const isContactWelcome = (isStreamer && isPublic) ? (document.getElementById('regIsContactWelcome').value === 'true') : (!isStreamer ? true : false);

    // ★ スプレッドシートの全35列キーに合わせたフラットデータオブジェクト
    const payloadData = {
      honeypot: document.getElementById('regWebsiteUrl').value,
      role: role,
      displayName: displayName,
      password: pwd.trim(),
      isPublic: isPublic,
      isContactWelcome: isContactWelcome,
      category: selectedCategories.join(','),
      tags: selectedTags.join(','),
      freeTags: document.getElementById('regFreeTags').value.trim(),
      priceGuide: role === 'creator' ? document.getElementById('regPriceGuide').value : '',
      avatarUrl: cleanedAvatarUrl,
      description: document.getElementById('regDescription').value,
      contactInfo: document.getElementById('regContactInfo').value.trim(),
      xUrl: xUrl,
      portfolioUrl: document.getElementById('regPortfolioUrl').value.trim()
    };

    // 代表作品 1〜4 を各列キーでセット（Googleドライブ自動変換付き）
    const workBlocks = document.querySelectorAll('.reg-work-block');
    workBlocks.forEach((block, idx) => {
      const i = idx + 1;
      const type = block.querySelector('.reg-work-type').value;
      const rawUrl = block.querySelector('.reg-work-url').value.trim();
      const rawImg = block.querySelector('.reg-work-image').value.trim();

      payloadData[`works_type-${i}`] = type;
      payloadData[`works_url-${i}`] = rawUrl ? normalizeDriveUrl(rawUrl, type === 'image' ? 'image' : 'preview') : '';
      payloadData[`works_image-${i}`] = rawImg ? normalizeDriveUrl(rawImg, 'image') : '';
    });

    // プラットフォーム 1〜3 を各列キーでセット
    const platformRows = document.querySelectorAll('.reg-platform-row');
    platformRows.forEach((row, idx) => {
      const i = idx + 1;
      payloadData[`platforms_name-${i}`] = row.querySelector('.reg-platform-label').value.trim();
      payloadData[`platforms_url-${i}`] = row.querySelector('.reg-platform-url').value.trim();
    });

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'register',
          data: payloadData
        }),
        redirect: 'follow'
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('castelier_registered_at', Date.now().toString());
        alert(`登録が完了しました！\nあなたのアカウントIDは【 ${data.userId} 】です。\nログイン時に必要となるため必ず控えてください。`);
        sessionStorage.setItem('castelier_session', JSON.stringify({
          userId: data.userId,
          password: pwd.trim()
        }));
        window.location.href = './top.html';
      } else {
        showStatus(data.message || '登録に失敗しました。', false);
      }
    } catch (err) {
      console.error(err);
      showStatus('通信エラーが発生しました: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = '登録してTOPへ進む';
    }
  }

  // ログイン処理
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '照合中...';
    hideStatus();

    const userId = document.getElementById('loginUserId').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'login',
          data: { userId, password }
        }),
        redirect: 'follow'
      });
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('castelier_session', JSON.stringify({
          userId: userId,
          password: password
        }));
        window.location.href = './top.html';
      } else {
        showStatus(data.message || 'ログインに失敗しました。', false);
      }
    } catch (err) {
      console.error(err);
      showStatus('通信エラーが発生しました: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'ログイン';
    }
  }

  // ユーティリティ関数
  function normalizeDriveUrl(url, type = 'image') {
    if (!url || typeof url !== 'string') return '';
    const trimmed = url.trim();
    const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]{25,})/;
    const match = trimmed.match(driveRegex);
    if (match && match[1]) {
      const fileId = match[1];
      return type === 'image'
        ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`
        : `https://drive.google.com/file/d/${fileId}/preview`;
    }
    return trimmed;
  }

  function isValidImageUrl(url) {
    if (!url) return true;
    const trimmed = url.trim();
    if (/drive\.google\.com/.test(trimmed)) return true;
    const isDirectImage = /\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i.test(trimmed);
    const isHttps = /^https?:\/\//i.test(trimmed);
    return isHttps && (isDirectImage || trimmed.includes('googleusercontent.com'));
  }

  function updateImagePreview(inputId, previewBoxId) {
    const input = document.getElementById(inputId);
    const box = document.getElementById(previewBoxId);
    const img = box.querySelector('img');
    const rawVal = input.value.trim();

    if (!rawVal) {
      box.style.display = 'none';
      img.src = '';
      return;
    }

    const converted = normalizeDriveUrl(rawVal, 'image');
    if (isValidImageUrl(rawVal)) {
      img.src = converted;
      img.onload = () => { box.style.display = 'flex'; };
      img.onerror = () => { box.style.display = 'none'; };
    } else {
      box.style.display = 'none';
    }
  }

  function setupTooltipToggle() {
    document.addEventListener('click', (e) => {
      const targetIcon = e.target.closest('.info-icon');
      document.querySelectorAll('.info-icon.active').forEach(icon => {
        if (icon !== targetIcon) icon.classList.remove('active');
      });
      if (targetIcon) targetIcon.classList.toggle('active');
    });
  }

  function setupTermsUnlock() {
    const termsLink = document.getElementById('termsLink');
    const agreeCheckbox = document.getElementById('regAgreeTerms');
    const notice = document.getElementById('termsNotice');

    if (!termsLink || !agreeCheckbox) return;

    termsLink.addEventListener('click', () => {
      agreeCheckbox.disabled = false;
      agreeCheckbox.checked = true;
      if (notice) {
        notice.style.color = '#10b981';
        notice.textContent = '✓ ガイドラインを確認しました。';
      }
    });
  }
</script>
